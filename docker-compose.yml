version: '3.8'

services:
  # ---------------------------------------------
  # Base de Datos PostgreSQL 16
  # ---------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: hospedaje_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hospedaje_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hospedaje_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-hospedaje_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hospedaje_user} -d ${POSTGRES_DB:-hospedaje_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------
  # Backend NestJS (SOA SCH-1..8)
  # ---------------------------------------------
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: hospedaje_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-hospedaje_user}:${POSTGRES_PASSWORD:-hospedaje_pass_2026}@postgres:5432/${POSTGRES_DB:-hospedaje_db}?schema=public
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key-2026}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-super-secret-refresh-key-2026}
      RECEPCION_API_KEY: ${RECEPCION_API_KEY:-demo-recepcion-key}
      RESERVACIONES_WEBHOOK_URL: ${RESERVACIONES_WEBHOOK_URL:-}
      RESERVACIONES_WEBHOOK_SECRET: ${RESERVACIONES_WEBHOOK_SECRET:-demo-webhook-secret}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      TZ: America/Hermosillo
      TURNO_CRON: ${TURNO_CRON:-0 7 * * *}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-DemoPass2026!}
      RUN_SEED: "true"
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ---------------------------------------------
  # Frontend React 18 + Vite (Nginx)
  # ---------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        VITE_API_URL: http://localhost:3000/api/v1
        VITE_DEMO_MODE: "true"
        VITE_BASE_PATH: "./"
    container_name: hospedaje_frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  postgres_data:
    driver: local
