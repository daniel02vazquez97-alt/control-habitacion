name: CD - Despliegue Automatizado

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write
  packages: write

jobs:
  # ----------------------------------------------------
  # 1. Despliegue de Frontend en GitHub Pages
  # ----------------------------------------------------
  deploy-frontend:
    name: Despliegue Frontend (GitHub Pages)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias del monorepo
        run: npm ci

      - name: Compilar paquete compartido @control-habitacion/shared
        run: npm run build:shared

      - name: Compilar frontend para GitHub Pages
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'http://localhost:3000/api/v1' }}
          VITE_DEMO_MODE: ${{ vars.VITE_DEMO_MODE || 'true' }}
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: |
          echo "Compilando Frontend con base path: /${{ github.event.repository.name }}/ y API URL: $VITE_API_URL"
          npm --workspace=@control-habitacion/frontend run build

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto para GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/frontend/dist

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ----------------------------------------------------
  # 2. Despliegue de Backend en GHCR y Render
  # ----------------------------------------------------
  deploy-backend:
    name: Despliegue Backend (GHCR & Render)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticar en GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extraer metadatos para Docker (tags y labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-backend
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Construir y publicar imagen Docker en GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Notificar a Render mediante Deploy Hook
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "Invocando webhook de despliegue en Render..."
            curl -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
            echo "Deploy hook invocado con éxito."
          else
            echo "Aviso: secrets.RENDER_DEPLOY_HOOK_URL no configurado. Saltando invocación de Render."
          fi

  # ----------------------------------------------------
  # 3. Verificación Final de Disponibilidad (Smoke Test)
  # ----------------------------------------------------
  smoke-test:
    name: Verificación Final (Smoke Test de Salud)
    needs: [deploy-backend]
    runs-on: ubuntu-latest
    if: vars.VITE_API_URL != ''

    steps:
      - name: Esperar y sondear endpoint /health
        run: |
          API_URL="${{ vars.VITE_API_URL }}"
          HEALTH_URL="${API_URL%/}/health"
          echo "Ejecutando Smoke Test contra: $HEALTH_URL"
          
          MAX_ATTEMPTS=25
          DELAY=10
          ATTEMPT=1
          
          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "Intento $ATTEMPT/$MAX_ATTEMPTS: consultando $HEALTH_URL..."
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL" || echo "000")
            
            if [ "$STATUS" -eq 200 ]; then
              echo "✔ Smoke Test exitoso: el servicio respondió HTTP 200 OK."
              exit 0
            fi
            
            echo "Respuesta HTTP $STATUS. Esperando ${DELAY}s para reintentar..."
            sleep $DELAY
            ATTEMPT=$((ATTEMPT + 1))
          done
          
          echo "✖ Falló el Smoke Test: El servicio no respondió HTTP 200 tras $MAX_ATTEMPTS intentos."
          exit 1
