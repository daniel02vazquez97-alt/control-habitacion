name: CD - Despliegue en Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write   # publicar la imagen del backend en GHCR
  id-token: write   # iniciar sesión en Azure con OIDC (sin contraseñas)

env:
  AZURE_RESOURCE_GROUP: rg-control-habitaciones
  AZURE_CONTAINER_APP: ca-control-habitacion-api
  IMAGE: ghcr.io/${{ github.repository }}-backend

jobs:
  # ----------------------------------------------------
  # 1. Backend: imagen en GHCR y despliegue en Azure Container Apps
  # ----------------------------------------------------
  deploy-backend:
    name: Backend (GHCR → Azure Container Apps)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticar en GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar imagen Docker en GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}

      - name: Iniciar sesión en Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Actualizar la imagen de la Container App
        run: |
          az extension add --name containerapp --upgrade --only-show-errors
          az containerapp update \
            --name "$AZURE_CONTAINER_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "$IMAGE:sha-${{ github.sha }}" \
            --output none
          FQDN=$(az containerapp show -n "$AZURE_CONTAINER_APP" -g "$AZURE_RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn -o tsv)
          echo "Backend desplegado en https://$FQDN/api/v1" >> "$GITHUB_STEP_SUMMARY"

  # ----------------------------------------------------
  # 2. Frontend: Azure Static Web Apps (plan Free)
  # ----------------------------------------------------
  deploy-frontend:
    name: Frontend (Azure Static Web Apps)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias del monorepo
        run: npm ci

      - name: Compilar paquete compartido @control-habitacion/shared
        run: npm run build:shared

      - name: Compilar frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_DEMO_MODE: ${{ vars.VITE_DEMO_MODE || 'true' }}
          VITE_BASE_PATH: /
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "::error::Falta la variable VITE_API_URL (URL de la Container App + /api/v1). La genera infra/azure/crear-recursos.ps1."
            exit 1
          fi
          npm --workspace=@control-habitacion/frontend run build

      - name: Publicar en Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: apps/frontend/dist
          skip_app_build: true
          skip_api_build: true

  # ----------------------------------------------------
  # 3. Verificación final (smoke test de salud)
  # ----------------------------------------------------
  smoke-test:
    name: Verificación final (/health)
    needs: [deploy-backend]
    runs-on: ubuntu-latest
    if: vars.VITE_API_URL != ''

    steps:
      - name: Sondear /health (incluye el arranque desde cero réplicas)
        run: |
          HEALTH_URL="${{ vars.VITE_API_URL }}"
          HEALTH_URL="${HEALTH_URL%/}/health"
          echo "Smoke test contra: $HEALTH_URL"
          for i in $(seq 1 25); do
            BODY=$(curl -s -w "\n%{http_code}" "$HEALTH_URL" || echo -e "\n000")
            STATUS=$(echo "$BODY" | tail -n1)
            if [ "$STATUS" = "200" ]; then
              echo "✔ El backend respondió 200 y la base de datos está conectada:"
              echo "$BODY" | head -n -1
              exit 0
            fi
            echo "Intento $i/25: HTTP $STATUS. Reintentando en 10 s..."
            sleep 10
          done
          echo "✖ El backend no respondió 200 en /health."
          exit 1
